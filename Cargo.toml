[package]
name = "dprint-plugin-markdown"
version = "0.23.2"
authors = ["David Sherret <dsherret@gmail.com>"]
edition = "2021"
homepage = "https://github.com/dprint/dprint-plugin-markdown"
license = "MIT"
repository = "https://github.com/dprint/dprint-plugin-markdown"
description = "Markdown formatter for dprint."

[lib]
crate-type = ["lib", "cdylib"]

[profile.release]
opt-level = 3
debug = false
lto = true
debug-assertions = false
overflow-checks = false
panic = "abort"

[features]
wasm = ["serde_json", "dprint-core/wasm"]
tracing = ["dprint-core/tracing"]

[[test]]
name = "specs"
path = "tests/spec_test.rs"
harness = false

[[test]]
name = "parser_specs"
path = "tests/parser_spec_test.rs"
harness = false

[[test]]
name = "html_parser_specs"
path = "tests/html_parser_spec_test.rs"
harness = false

[dependencies]
dprint-core = { version = "0.69.1", features = ["formatting"] }
dprint-core-macros = "0.1.0"
serde = { version = "1.0.144", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
thiserror = "2.0"
unicode-width = "0.2"

[dev-dependencies]
dprint-development = "0.11.0"
file_test_runner = "0.12.1"
serde_json = { version = "1.0" }
